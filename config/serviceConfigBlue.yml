protocol: http
basepath:
port: 3003
host: localhost
version: 1.0
logConfig:
  outputPaths:
    - stdout
    - /tmp/MessageBlueBox.log
  logger: zap
  encoding: console
  level: debug
  errorPaths:
    - stderr
    - /tmp/MessageBoxBlueErrors.log
couchbaseConfig:
  host: MessageBoxDB
  username: admin
  password: password
  bucket: messageBox
  documentKey: message-box-doc
  retries: 10 # Number of retries for attempts to connect to the DB